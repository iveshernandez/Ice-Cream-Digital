<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ice Cream 720p HD Rapido</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui}
#authOverlay{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center}
canvas{width:360px;height:450px;background:#000;border-radius:12px;display:block;margin:20px auto;border:2px solid #FFD60A}
.btn{background:#FFD60A;color:#000;border:none;padding:14px 24px;border-radius:10px;font-weight:900;cursor:pointer;width:100%;margin:8px 0}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
</style></head><body>
<div id="authOverlay"><div style="text-align:center"><h2 style="color:#FFD60A;font-family:Anton">ICE CREAM 720p HD</h2>
<input id="user" placeholder="Usuario" style="max-width:300px"><input id="pass" type="password" placeholder="Pass" style="max-width:300px">
<button class="btn" style="max-width:300px" onclick="localStorage.setItem('ic_session_v19',JSON.stringify({username:document.getElementById('user').value}));document.getElementById('authOverlay').style.display='none'">Entrar</button></div></div>
<div style="padding:20px;max-width:900px;margin:0 auto">
<h1 style="font-family:Anton;color:#FFD60A;text-align:center">EDITOR 720p HD</h1>
<textarea id="titulo" rows="3">ESTE ES TU TITULO VIRAL EN 720P HD</textarea>
<input type="file" id="videoFile" accept="video/*">
<canvas id="preview" width="720" height="900"></canvas>
<button class="btn" onclick="previewVideo()">Preview</button>
<button class="btn" style="background:#fff" onclick="render720p()">⚡ Render 720p HD Rapido</button>
<div id="progress" style="display:none"><div style="background:#222;border-radius:10px;height:20px;overflow:hidden"><div id="bar" style="background:#FFD60A;height:100%;width:0%"></div></div><p id="progText" style="text-align:center">0%</p></div>
</div>
<script>
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');let videoEl=null,dirHandle=null;
setTimeout(()=>{try{const s=JSON.parse(localStorage.getItem('ic_session_v19')||'null');if(s&&s.username)document.getElementById('authOverlay').style.display='none';}catch{}},300);
document.getElementById('videoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;videoEl=document.createElement('video');videoEl.src=URL.createObjectURL(f);videoEl.muted=true;videoEl.playsInline=true;videoEl.onloadeddata=()=>previewVideo();});
function getLines(){const txt=document.getElementById('titulo').value.toUpperCase().split(' ');let lines=[],cur='';for(const w of txt){if((cur+' '+w).length>28){lines.push(cur);cur=w;}else cur=cur?cur+' '+w:w;}if(cur)lines.push(cur);return lines.slice(0,3);}
function drawFrame(v,l){ctx.clearRect(0,0,720,900);if(v&&v.readyState>=2)try{ctx.drawImage(v,0,0,720,900);}catch{}else{ctx.fillStyle='#111';ctx.fillRect(0,0,720,900);}const tC=document.createElement('canvas');tC.width=720;tC.height=200;const tX=tC.getContext('2d');tX.textAlign='center';tX.textBaseline='middle';tX.lineJoin='round';l.forEach((line,i)=>{const fs=line.length>25?28:34,y=42+i*40;tX.font=`900 ${fs}px Anton`;const w=tX.measureText(line).width,rw=w+44;tX.fillStyle='#000';try{tX.beginPath();tX.roundRect(360-rw/2,y-15,rw,30,8);tX.fill();}catch{tX.fillRect(360-rw/2,y-15,rw,30);}tX.lineWidth=5;tX.strokeStyle='#000';tX.strokeText(line,360,y);tX.fillStyle='#fff';tX.fillText(line,360,y);});ctx.drawImage(tC,0,0);}
function previewVideo(){const l=getLines();if(videoEl){const loop=()=>{if(videoEl.paused)return;drawFrame(videoEl,l);requestAnimationFrame(loop);};videoEl.currentTime=0;videoEl.play().then(()=>requestAnimationFrame(loop)).catch(()=>drawFrame(videoEl,l));}else drawFrame(null,l);}
async function render720p(){if(!videoEl)return alert('Selecciona video');const lines=getLines();canvas.width=720;canvas.height=900;document.getElementById('progress').style.display='block';const bar=document.getElementById('bar'),progText=document.getElementById('progText');const onProg=p=>{bar.style.width=p+'%';progText.textContent=Math.round(p)+'% - 720p HD 4.5Mbps';};const tituloCanvas=document.createElement('canvas');tituloCanvas.width=720;tituloCanvas.height=220;const tCtx=tituloCanvas.getContext('2d');tCtx.textAlign='center';tCtx.textBaseline='middle';tCtx.lineJoin='round';const cached=lines.map(l=>{const fs=l.length>25?28:34;tCtx.font=`900 ${fs}px Anton`;return{text:l,fs,w:tCtx.measureText(l).width};});cached.forEach((c,i)=>{const y=42+i*40,rw=c.w+44;tCtx.fillStyle='#000';try{tCtx.beginPath();tCtx.roundRect(360-rw/2,y-15,rw,30,8);tCtx.fill();}catch{tCtx.fillRect(360-rw/2,y-15,rw,30);}tCtx.font=`900 ${c.fs}px Anton`;tCtx.lineWidth=5;tCtx.strokeStyle='#000';tCtx.strokeText(c.text,360,y);tCtx.fillStyle='#fff';tCtx.fillText(c.text,360,y);});videoEl.currentTime=0;await videoEl.play().catch(()=>{});const realTotal=videoEl.duration||10;ctx.clearRect(0,0,720,900);try{ctx.drawImage(videoEl,0,0,720,900);}catch{}ctx.drawImage(tituloCanvas,0,0);await new Promise(r=>setTimeout(r,80));const cStream=canvas.captureStream(30);const mimeList=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9'];const mimeMP4=mimeList.find(m=>{try{return MediaRecorder.isTypeSupported(m);}catch{return false;}})||'video/webm';const rec=new MediaRecorder(cStream,{mimeType:mimeMP4,videoBitsPerSecond:4500000,audioBitsPerSecond:64000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const blobP=new Promise(r=>rec.onstop=()=>r(new Blob(chunks,{type:'video/mp4'})));rec.start(1000);let start=performance.now(),last=0;await new Promise(res=>{const draw=now=>{if(now-last<33){if((now-start)/1000<realTotal)requestAnimationFrame(draw);else res();return;}last=now;const cur=Math.min((now-start)/1000,realTotal);onProg(Math.min((cur/realTotal)*100,100));if(cur>=realTotal){res();return;}try{ctx.drawImage(videoEl,0,0,720,900);}catch{}ctx.drawImage(tituloCanvas,0,0);requestAnimationFrame(draw);};requestAnimationFrame(draw);});rec.stop();cStream.getTracks().forEach(t=>t.stop());const blob=await blobP;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ice-720p-${Date.now()}.mp4`;a.click();onProg(100);if(dirHandle){try{const num=String(Math.floor(Math.random()*8)+1).padStart(2,'0');const sub=await dirHandle.getDirectoryHandle(num);const fh=await sub.getFileHandle(`ice-720p-${Date.now()}.mp4`,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();}catch{}}}
async function selCarpeta(){try{dirHandle=await window.showDirectoryPicker();for(let i=1;i<=8;i++)await dirHandle.getDirectoryHandle(String(i).padStart(2,'0'),{create:true});alert('Carpetas 01-08 listas');}catch{}}
</script><button onclick="selCarpeta()" style="position:fixed;bottom:20px;right:20px;z-index:9999;background:#FFD60A;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:900">📁 Carpeta 01-08</button></body></html>
