<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icecream WebGPU Vercel Test</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;margin:0;padding:22px}main{max-width:920px;margin:auto}.c{background:#172033;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
textarea{width:100%;box-sizing:border-box;min-height:125px;padding:12px;border-radius:10px}button{background:#f59e0b;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin:5px}button:disabled{opacity:.5}
pre{background:#020617;padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}progress{width:100%;height:20px}canvas{display:none;width:360px;max-width:100%;border-radius:12px;margin-top:12px}.m{color:#cbd5e1}
</style></head><body><main>
<div class="c"><h1>Icecream WebGPU — Vercel Test</h1>
<p class="m">IMPORTANTE: súbelo a GitHub/Vercel y ábrelo desde https://. No lo abras con file://.</p>
<textarea id="prompt">photorealistic wildlife documentary photograph, exactly two killer whales, one large adult orca and one visibly smaller calf, swimming naturally side by side underwater, complete bodies visible, correct anatomy, realistic proportions, open blue ocean, natural sunlight rays, professional wildlife photography, no text, no watermark</textarea>
<button id="load">1. Cargar SD-Turbo WebGPU</button><button id="gen" disabled>2. Generar imagen</button>
</div>
<div class="c"><progress id="bar" max="100" value="0"></progress><pre id="status">Esperando. Debe ejecutarse desde HTTPS.</pre><canvas id="cv" width="720" height="1280"></canvas></div>
<script type="module">
const st=document.querySelector("#status"),bar=document.querySelector("#bar"),lb=document.querySelector("#load"),gb=document.querySelector("#gen"),cv=document.querySelector("#cv");
let client=null;
function p(x={}){if(x.pct!=null)bar.value=x.pct;else bar.removeAttribute("value");let m=x.message||x.phase||"Procesando";if(x.bytesDownloaded!=null&&x.totalBytesExpected!=null)m+=` · ${(x.bytesDownloaded/1048576).toFixed(1)}/${(x.totalBytesExpected/1048576).toFixed(1)} MB`;st.textContent=m+(x.pct!=null?` · ${x.pct}%`:"")}
lb.onclick=async()=>{
 try{
  if(location.protocol!=="https:"&&location.hostname!=="localhost")throw Error("Este archivo debe abrirse desde tu URL HTTPS de Vercel, no con doble clic.");
  if(!navigator.gpu)throw Error("WebGPU no está disponible.");
  lb.disabled=true;bar.removeAttribute("value");st.textContent="Importando web-txt2img desde HTTPS…";
  const lib=await import("https://esm.sh/web-txt2img@0.3.1?bundle");
  client=lib.Txt2ImgWorkerClient.createDefault();
  const caps=await client.detect();
  st.textContent="Capacidades:\n"+JSON.stringify(caps,null,2)+"\n\nCargando SD-Turbo…";
  const t=performance.now();
  const r=await client.load("sd-turbo",{backendPreference:["webgpu"]},p);
  if(!r?.ok)throw Error(r?.message||r?.reason||"No se pudo cargar SD-Turbo.");
  bar.value=100;gb.disabled=false;
  st.textContent=`✅ MODELO LISTO\nBackend: ${r.backendUsed||"webgpu"}\nCarga: ${((performance.now()-t)/1000).toFixed(1)} s\nDescargado ahora: ${typeof r.bytesDownloaded==="number"?(r.bytesDownloaded/1048576).toFixed(1)+" MB":"caché/medición no disponible"}`;
 }catch(e){lb.disabled=false;st.textContent="❌ "+(e?.stack||e)}
};
function compose(blob){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(blob);im.onload=()=>{try{let c=cv.getContext("2d");c.clearRect(0,0,720,1280);let k=Math.max(720/im.width,1280/im.height),w=im.width*k,h=im.height*k;c.save();c.filter="blur(26px)";c.drawImage(im,(720-w)/2,(1280-h)/2,w,h);c.restore();let f=Math.min(720/im.width,1280/im.height),fw=im.width*f,fh=im.height*f;c.drawImage(im,(720-fw)/2,(1280-fh)/2,fw,fh);cv.style.display="block";URL.revokeObjectURL(u);cv.toBlob(ok,"image/jpeg",.94)}catch(e){no(e)}};im.onerror=no;im.src=u})}
gb.onclick=async()=>{
 gb.disabled=true;bar.value=0;let t=performance.now();
 try{
  let seed=Math.floor(Math.random()*2147483647);
  let job=client.generate({prompt:document.querySelector("#prompt").value.trim(),seed},e=>p({...e,message:"IA: "+(e.phase||"generando")}),{busyPolicy:"queue",debounceMs:0});
  let r=await job.promise;if(!r?.ok)throw Error(r?.message||r?.reason||"Generación falló");
  let b=await compose(r.blob);bar.value=100;
  st.textContent=`✅ GENERACIÓN TERMINADA\nIA WebGPU: ${(Number(r.timeMs||0)/1000).toFixed(1)} s\nTotal: ${((performance.now()-t)/1000).toFixed(1)} s\nModelo: SD-Turbo\nImagen IA: 512×512\nArchivo final: 720×1280`;
  let old=document.querySelector("#save");if(old)old.remove();let bt=document.createElement("button");bt.id="save";bt.textContent="Guardar 720×1280";bt.onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download="icecream_webgpu_720x1280.jpg";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};cv.after(bt);
 }catch(e){st.textContent="❌ "+(e?.stack||e)}finally{gb.disabled=false}
};
</script></main></body></html>
